"aurelius|nietzsche":{t:["courage","discipline","meaning"],why:"Both wrote about hardship and how to face it, from very different positions. Marcus Aurelius was a Roman emperor and Stoic writing private notes. Nietzsche was a 19th-century philosopher who criticised Stoicism.",ctx:"Marcus Aurelius (121–180) wrote the Meditations as personal notes while ruling Rome. Nietzsche (1844–1900) wrote after traditional religion had lost its hold on much of Europe. Marcus could not respond to Nietzsche, but Nietzsche did criticise the Stoic ideal of living “according to nature” in Beyond Good and Evil, section 9.",sim:"Both treat obstacles and suffering as material for growth, and both give more weight to inner effort than to outward comfort.",diff:"Marcus stresses accepting what lies outside our control and serving the common good. Nietzsche stresses creating one’s own values and affirming life, and he distrusted calm acceptance.",con:"Together they offer two answers to hardship: endure it with reason and discipline, or turn it into self-overcoming. Each is a reading of a large body of work, so treat this as a starting point."},

DR.confucius3={s:"Confucius answers a question about humaneness with two words: love people.",c:"In Analects 12.22, a disciple named Fan Chi asks about humaneness (ren), and Confucius replies “Love people.” Fan Chi then asks about wisdom, and Confucius says “Know people.” Translations vary.",i:["Humaneness is shown first in care for other people, not in abstract rules.","The pairing with “know people” suggests that care needs judgment."],ex:"A manager might ask both whether they care about their team and whether they understand each person’s situation.",o:"Some argue that love of people in general is too vague to guide hard choices, such as how to weigh one person’s needs against another’s.",q:["What does loving people ask of you in practice?","Can you love people without knowing them?"]};
DR.nietzsche0={s:"If you have a strong enough reason to live, you can put up with almost any hardship.",c:"This aphorism is in Twilight of the Idols (written in 1888, published in 1889), in the section Maxims and Arrows. It is a single sentence, not a full argument, and translations vary.",i:["Meaning can make suffering bearable.","It can also be read as a warning that comfort alone does not give life direction."],ex:"A student might endure long hours of study more easily when the study serves a goal they truly care about.",o:"Some argue that a reason to live does not make every suffering bearable, and that some hardships need practical help, not meaning.",q:["What is your own “why” right now?","When does a reason to endure help, and when does it only excuse unnecessary suffering?"]};
DR.aurelius0={s:"An obstacle can become the thing you act on.",c:"This is a paraphrase of Meditations 5.20, one of the private notes Marcus wrote to himself, probably not for publication. Translations differ, and the neat modern phrasing is not a literal rendering.",i:["Obstacles are not only problems to avoid but material to work with.","A Stoic reading stresses that the judgment we make about an obstacle is within our control."],ex:"A delayed project might become a chance to improve the plan instead of a reason to give up.",o:"Critics say the idea can sound too positive, since some obstacles truly block people and should be removed, not accepted.",q:["Which obstacle in your life could you treat as material?","When is it wiser to remove an obstacle than to work with it?"]};
DR.lincoln1={s:"Lincoln asks the nation to end the war without bitterness toward the defeated.",c:"Lincoln spoke these words in his Second Inaugural Address on 4 March 1865, as the Civil War was nearing its end. He was assassinated on 14 April 1865.",i:["The phrase calls for reconciliation and charity, not revenge.","The same speech names slavery as a cause of the war, so the call for charity is not a call to forget it."],ex:"People cite it when a community has to live together after a bitter dispute.",o:"Some argue that calls for reconciliation can pressure victims to forgive before justice is done.",q:["Can reconciliation come before justice, or only after it?","What would charity toward a former opponent look like today?"]};
DR.dostoevsky3={s:"Love that is only imagined is easy, and love that acts in daily life is hard.",c:"This is said by Elder Zosima, a character in The Brothers Karamazov (1879–80), to a woman who says she loves humanity in general but finds individual people hard to bear. It is a character’s remark, not necessarily Dostoevsky’s own statement.",i:["Love is measured by actions toward real people, not by feelings or ideals alone.","It warns against loving an idea of humanity while neglecting the person in front of you."],ex:"Someone who supports a charity in principle but avoids helping a neighbour might recognise the tension.",o:"Some say feelings and ideals also matter and can inspire action, so love in dreams is not worthless.",q:["Where do you love in “dreams” but not yet in action?","Can ideals help action, or do they replace it?"]};
DR.shakespeare0={s:"Be honest with yourself and act accordingly.",c:"Polonius says this to his son Laertes in Hamlet, act 1, scene 3, as Laertes leaves for France. Scholars debate whether to read the advice sincerely or ironically, since Polonius is a talkative and not always honest adviser.",i:["On a sincere reading, integrity means acting in line with one’s own values.","On an ironic reading, the advice sounds wise but comes from a man who is not always honest himself."],ex:"Someone choosing a career might ask whether it fits their values or only other people’s expectations.",o:"Some say “being true to yourself” can excuse selfishness if the self is never examined.",q:["How do you tell your true self from a habit or a role?","Does the speaker’s character change how much you trust the advice?"]};
DR.gibran1={s:"Work done with love becomes a visible form of that love.",c:"This line is from “On Work,” a prose poem in The Prophet (1923), in which the prophet Almustafa answers questions from the people of Orphalese.",i:["Care shows in the quality of everyday work, not only in words.","Gibran contrasts work done with love and work done grudgingly."],ex:"A craftsperson or teacher who cares about the result shows that care through the work itself.",o:"Some say not everyone can love their work, and that working mainly to support one’s family is also honourable.",q:["What work of yours shows care?","Is it fair to expect people to love their work?"]};
DR.einstein1={s:"The key to understanding is to keep asking questions.",c:"Einstein said this in an interview with William Miller published in LIFE magazine in 1955, shortly after his death. He added that curiosity has its own reason for existing.",i:["Curiosity is worth keeping alive for its own sake.","Progress in science begins with questions, not only answers."],ex:"A student might notice that the best questions in class often lead to the deepest understanding.",o:"Some argue that questions alone are not enough, and that disciplined study and method turn curiosity into knowledge.",q:["What question are you curious about right now?","How do you turn curiosity into learning?"]};
DR.machiavelli0={s:"If a ruler cannot be both loved and feared, fear is the safer choice, but he should avoid being hated.",c:"This is from The Prince, chapter 17 (written 1513), where Machiavelli asks whether it is better to be loved or feared. He adds that a prince should avoid being hated.",i:["Machiavelli describes how power works in unstable states, as he saw them.","Readers disagree about whether he recommends this or only describes it."],ex:"A leader taking over a troubled organisation might have to enforce rules firmly while still keeping people’s respect.",o:"Critics argue that rule by fear breeds resentment, and that trust is a stronger basis for lasting authority.",q:["Is fear ever a legitimate basis for authority?","Why does Machiavelli stress avoiding hatred?"]};
